<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model Lab</title>
    <link rel="stylesheet" href="boxmodel.css">
</head>
<body>

    <h2>Phần 1: Chứng minh content-box vs border-box</h2>
    <div class="part-1-container">
        <div class="box box-1">
            Hộp 1 (content-box)
        </div>
        <div class="box box-2">
            Hộp 2 (border-box)
        </div>
    </div>

    <h2>Phần 2: Layout 3 cột (1000px Container)</h2>
    <div class="container border-box-layout">
        <div class="col sidebar">Sidebar (250px)</div>
        <div class="col content">Content (500px)</div>
        <div class="col ads">Ads (250px)</div>
    </div>

    <br><br>
    <h2>Phần 2: Layout 3 cột bị vỡ (Trường hợp không dùng border-box)</h2>
    <div class="container content-box-layout">
        <div class="col sidebar">Sidebar (250px)</div>
        <div class="col content">Content (500px)</div>
        <div class="col ads">Ads (250px)</div>
    </div>

</body>
</html>
