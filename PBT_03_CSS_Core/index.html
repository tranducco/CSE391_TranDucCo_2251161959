<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Câu C2 - Cascade Puzzle</title>
    <style>
        /* CSS đề bài cho */
        body { font-size: 16px; color: #333; }
        .container { font-size: 14px; }
        .card { color: blue; }
        .card .title { font-size: 20px; }
        .card p { color: inherit; }
        #featured .title { color: red; }
        .highlight { color: green !important; }

        /* CSS phụ trợ thêm vào để dễ nhìn hơn khi chụp màn hình (không ảnh hưởng bài giải) */
        .container { max-width: 600px; margin: 30px auto; font-family: sans-serif; }
        .card { border: 1px solid #ccc; padding: 20px; margin-bottom: 20px; border-radius: 8px; }
    </style>
</head>
<body>
    <div class="container">
        
        <!-- Sản phẩm A -->
        <div class="card" id="featured">
            <h2 class="title highlight">Sản phẩm A</h2>
            <p>Mô tả sản phẩm</p>
        </div>

        <!-- Sản phẩm B -->
        <div class="card">
            <h2 class="title">Sản phẩm B</h2>
            <p class="highlight">Mô tả sản phẩm B</p>
        </div>

    </div>
</body>
</html>
