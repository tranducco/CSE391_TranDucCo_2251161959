<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Navigation & Cards</title>
    <link rel="stylesheet" href="flexbox.css">
</head>
<body>

    <nav class="navbar">
        <div class="logo">
            <h2>CODE<span>WAVE</span></h2>
        </div>

        <ul class="nav-menu">
            <li><a href="#">Home</a></li>
            <li><a href="#">Products</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Contact</a></li>
        </ul>

        <div class="nav-actions">
            <button class="btn-login">Login</button>
            <button class="btn-register">Register</button>
        </div>
    </nav>

    <main class="container">
        <h2 class="section-title">Featured Products</h2>
        
        <div class="product-grid">
            <article class="card">
                <div class="card-image" style="background-color: #ff9a9e;"></div>
                <div class="card-content">
                    <h3 class="card-title">Sản phẩm 1</h3>
                    <p class="card-price">500.000 đ</p>
                </div>
                <button class="btn-buy">Mua ngay</button>
            </article>

            <article class="card">
                <div class="card-image" style="background-color: #fecfef;"></div>
                <div class="card-content">
                    <h3 class="card-title">Sản phẩm 2 với tên rất dài để test layout</h3>
                    <p class="card-price">650.000 đ</p>
                </div>
                <button class="btn-buy">Mua ngay</button>
            </article>

            <article class="card">
                <div class="card-image" style="background-color: #a1c4fd;"></div>
                <div class="card-content">
                    <h3 class="card-title">Sản phẩm 3</h3>
                    <p class="card-price">420.000 đ</p>
                </div>
                <button class="btn-buy">Mua ngay</button>
            </article>

            <article class="card">
                <div class="card-image" style="background-color: #c2e9fb;"></div>
                <div class="card-content">
                    <h3 class="card-title">Sản phẩm 4</h3>
                    <p class="card-price">890.000 đ</p>
                </div>
                <button class="btn-buy">Mua ngay</button>
            </article>

            <article class="card">
                <div class="card-image" style="background-color: #d4fc79;"></div>
                <div class="card-content">
                    <h3 class="card-title">Sản phẩm 5</h3>
                    <p class="card-price">1.200.000 đ</p>
                </div>
                <button class="btn-buy">Mua ngay</button>
            </article>

            <article class="card">
                <div class="card-image" style="background-color: #96e6a1;"></div>
                <div class="card-content">
                    <h3 class="card-title">Sản phẩm 6</h3>
                    <p class="card-price">350.000 đ</p>
                </div>
                <button class="btn-buy">Mua ngay</button>
            </article>

            <article class="card">
                <div class="card-image" style="background-color: #fdcbf1;"></div>
                <div class="card-content">
                    <h3 class="card-title">Sản phẩm 7</h3>
                    <p class="card-price">780.000 đ</p>
                </div>
                <button class="btn-buy">Mua ngay</button>
            </article>

            <article class="card">
                <div class="card-image" style="background-color: #e6dee9;"></div>
                <div class="card-content">
                    <h3 class="card-title">Sản phẩm 8</h3>
                    <p class="card-price">290.000 đ</p>
                </div>
                <button class="btn-buy">Mua ngay</button>
            </article>
        </div>
    </main>

</body>
</html>
