<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transitions & Animations</title>
    <link rel="stylesheet" href="animations.css">
</head>
<body>
    <div class="container">
        <h2 class="section-title">Bài B2: CSS Transitions & Animations</h2>
        <!-- Yêu cầu 4: Loading spinner -->
        <div class="demo-section">
            <h3>4. Loading Spinner</h3>
            <div class="spinner"></div>
        </div>
        <!-- Yêu cầu 1, 2, 3: Card Hover, Image Zoom, Button Hover -->
        <div class="demo-section">
            <h3>1, 2, 3. Card & Button Hover Effects</h3>
            <div class="card">
                <!-- Image container cho hiệu ứng Zoom (Yêu cầu 3) -->
                <div class="img-container">
                    <img src="https://picsum.photos/800/400?random=1" alt="Product Image">
                </div>
                
                <div class="card-content">
                    <h4>Sản phẩm Demo</h4>
                    <p class="price">1.500.000đ</p>
                    
                    <!-- Nút Mua ngay cho hiệu ứng Hover (Yêu cầu 2) -->
                    <button class="btn">Mua ngay</button>
                </div>
            </div>
        </div>
        <!-- Yêu cầu 5: Fade-in -->
        <div class="demo-section">
            <h3>5. Fade-in Element (CSS Animation)</h3>
            <div class="fade-box">
                Nội dung này xuất hiện với hiệu ứng Fade-in mượt mà từ dưới lên!
            </div>
        </div>
    </div>
</body>
</html>
