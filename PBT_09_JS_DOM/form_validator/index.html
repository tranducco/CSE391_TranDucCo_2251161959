<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Validator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="form-container">
        <h2>Đăng Ký Tài Khoản</h2>
        <form id="registerForm">
            <div class="form-group">
                <label>Họ và Tên:</label>
                <div class="input-wrapper">
                    <input type="text" id="name" placeholder="Nhập tên của bạn">
                    <span id="nameIcon" class="icon"></span>
                </div>
            </div>

            <div class="form-group">
                <label>Email:</label>
                <input type="text" id="email" placeholder="example@gmail.com">
                <div id="emailError" class="error-msg"></div>
            </div>

            <div class="form-group">
                <label>Mật khẩu:</label>
                <input type="password" id="password" placeholder="Nhập mật khẩu">
                <div class="progress-bar-container">
                    <div id="passwordStrengthBar" class="progress-bar"></div>
                </div>
                <div id="passwordText" class="strength-text"></div>
            </div>

            <div class="form-group">
                <label>Xác nhận mật khẩu:</label>
                <input type="password" id="confirmPassword" placeholder="Nhập lại mật khẩu">
                <div id="confirmError" class="error-msg"></div>
            </div>

            <div class="form-group">
                <label>Số điện thoại:</label>
                <input type="text" id="phone" placeholder="0901-234-567">
                <div id="phoneError" class="error-msg"></div>
            </div>

            <button type="submit" id="submitBtn" disabled>Đăng Ký</button>
        </form>
    </div>

    <div id="successModal" class="modal-overlay">
        <div class="modal-content">
            <h3 style="color: green; margin-bottom: 15px;">Đăng ký thành công!</h3>
            <div id="modalData" style="text-align: left; margin-bottom: 20px;"></div>
            <button id="closeModalBtn">Đóng</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
