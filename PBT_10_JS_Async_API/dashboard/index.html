<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-API Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="dashboard-header">
            <h1>Tổng hợp Dữ liệu (Dashboard)</h1>
            <div class="controls">
                <button id="refreshBtn"> Refresh All</button>
                <span id="loadTime" class="badge"></span>
            </div>
        </header>

        <div id="globalLoading" class="global-loading hidden">
            <div class="spinner"></div>
            <p>Đang tải tất cả dữ liệu...</p>
        </div>

        <div class="dashboard-grid">
            
            <div class="widget">
                <h2> Người dùng mới</h2>
                <div id="widget-0" class="widget-content"></div>
            </div>

            <div class="widget">
                <h2> Ảnh Random</h2>
                <div id="widget-1" class="widget-content"></div>
            </div>

            <div class="widget">
                <h2> Thông tin QG</h2>
                <div id="widget-2" class="widget-content"></div>
            </div>

        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
