<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Directory CRUD</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Quản lý Người Dùng</h1>
        
        <div class="form-section">
            <form id="userForm">
                <input type="hidden" id="userId">
                <input type="text" id="name" placeholder="Họ và tên" required>
                <input type="email" id="email" placeholder="Email" required>
                <button type="submit" id="submitBtn">Thêm User</button>
                <button type="button" id="cancelBtn" class="hidden">Hủy</button>
            </form>
        </div>

        <div class="search-section">
            <input type="text" id="searchInput" placeholder="🔍 Tìm kiếm theo tên hoặc email...">
        </div>

        <div id="loading" class="hidden">
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
        </div>

        <div id="userList" class="user-list"></div>
    </div>

    <div id="toast" class="toast hidden"></div>

    <script src="app.js"></script>
</body>
</html>
